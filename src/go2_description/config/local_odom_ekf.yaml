### ekf config file ###
ekf_filter_node:
    ros__parameters:

        use_sim_time: false
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: false
        debug: false
        debug_out_file: /tmp/go2_local_odom_ekf_debug.txt
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: false
        map_frame: map                 
        odom_frame: odom                
        base_link_frame: base_footprint  
        world_frame: odom                

        odom0: utlidar_odom

        odom0_config: [true, true, false,
                       false, false, true,
                       true,  true,  false,
                       false, false, true,
                       false, false, false] 

        #        [x_pos   , y_pos    , z_pos,
        #         roll    , pitch    , yaw,
        #         x_vel   , y_vel    , z_vel,
        #         roll_vel, pitch_vel, yaw_vel,
        #         x_accel , y_accel  , z_accel]
        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: true
        odom0_pose_rejection_threshold: 5.0
        odom0_twist_rejection_threshold: 5.0

        # Keep the EKF single-source by default for 2D slam_toolbox mapping.
        # Fusing VSLAM absolute pose with Unitree/LiDAR odometry can make the
        # odom->base_footprint estimate jump when the two sources disagree.
        # odom1: /vslam/odom
        # odom1_config: [true, true, false,
        #                false, false, true,
        #                true,  true,  false,
        #                false, false, true,
        #                false, false, false]
