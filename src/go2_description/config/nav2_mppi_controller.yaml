controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.35
      movement_time_allowance: 12.0
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      trans_stopped_velocity: 0.10
      rot_stopped_velocity: 0.10
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 32
      model_dt: 0.05
      batch_size: 800
      # Noises
      vx_std: 0.2
      vy_std: 0.2                   # <= add for Omni
      wz_std: 0.4

      # Limits (tune to your comfort / Go2 limits)
      vx_max: 3.0
      vx_min: -0.35
      vy_max: 0.1                   # <= allow some lateral
      wz_max: 2.0

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni" # try "Omni"
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 4.0
        critical_weight: 5.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.7 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
        # TwirlingCritic:
        #   enabled: true
        #   twirling_cost_power: 1
        #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      # footprint_padding: 0.0
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 1.0
      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.800, -0.200], [-0.800, 0.200] ]"
      mark_threshold: 2
      always_send_full_costmap: True
      plugins: ['obstacle_layer','3d_lidar_layer', 'inflation_layer']

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True          # keep clears working on long returns
          expected_update_rate: 10.0  # Hz; drop stale data
          observation_persistence: 0.0  # seconds; small “linger” like STVL
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          raytrace_max_range: 5.0
          raytrace_min_range: 0.10
          max_obstacle_height: 2.0


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      3d_lidar_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 3.0
        observation_persistence: 0.3
        expected_update_rate: 8.0
        decay_model: 1
        voxel_size: 0.05
        z_voxels: 10
        max_obstacle_height: 0.7
        origin_z: 0.1
        mark_threshold: 3
        update_footprint_enabled: true
        combination_method: 0
        publish_voxel_map: false
        transform_tolerance: 0.5

        observation_sources: front3d #, velodyne

        velodyne:
          data_type: PointCloud2
          topic: /velodyne_points
          marking: true
          clearing: true
          obstacle_range: 12.0
          raytrace_range: 14.0
          min_obstacle_height: 0.10
          max_obstacle_height: 1.0
          model_type: 1
          horizontal_fov_angle: 6.283
          vertical_fov_angle: 0.5236
          vertical_fov_padding: 0.05
          # IMPORTANT: min_z is a vertical height filter, not radial range.
          # Use a small value so we keep floor-level obstacles.
          min_z: 0.05
          max_z: 30.0
          expected_update_rate: 8.0
          clear_after_reading: true

        front3d:
          #enabled: true #default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          topic: /pointcloud
          sensor_frame: radar
          marking: true
          clearing: true

          obstacle_range: 8.0           # very responsive near-field
          raytrace_range: 12.0           # slightly larger for clearing

          min_obstacle_height: 0.05
          max_obstacle_height: 0.75       # Go2 body clearance; bump if you want taller obstacles

          model_type: 1                  # 3D LiDAR
          horizontal_fov_angle: 6.283    # 360°
          vertical_fov_angle: 1.571      # 90° total
          vertical_fov_padding: 0.05
          clear_after_reading: true
          # expected_update_rate: 0.0 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 1.0

          min_z: 0.05                    # L1 near blind spot
          max_z: 20.0   

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.2
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.30
      resolution: 0.05
      rolling_window: False         # <-- static global map
      # width: 80
      # height: 80
      track_unknown_space: True     # <-- consistent with StaticLayer below
      always_send_full_costmap: True
      plugins: ["static_layer","inflation_layer"] # "obstacle_layer",

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true   # map comes from topic_tools/relay (volatile)
        footprint_clearing_enabled: true
        enabled: true
        subscribe_to_updates: true
        track_unknown_space: true
        lethal_cost_threshold: 50

        # obstacle_layer:
        #   plugin: "nav2_costmap_2d::ObstacleLayer"
        #   enabled: True
        #   observation_sources: scan
        #   scan:
        #     topic: /scan
        #     max_obstacle_height: 2.0
        #     clearing: True
        #     marking: True
        #     data_type: "LaserScan"
        #     raytrace_max_range: 3.0
        #     raytrace_min_range: 0.0
        #     obstacle_max_range: 2.5
        #     obstacle_min_range: 0.0

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        mark_threshold: 5
        enabled: true
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 12
        max_obstacle_height: 0.75
        publish_voxel_map: false
        # Combine with static map using "max" semantics
        combination_method: 0

        observation_sources: zed_points #velodyne 

        velodyne:
            topic: /velodyne_points
            data_type: PointCloud2
            expected_update_rate: 0.0
            observation_persistence: 0.0
            min_obstacle_height: 0.05
            max_obstacle_height: 0.75
            obstacle_min_range: 0.0
            obstacle_max_range: 25.0
            raytrace_min_range: 0.0
            raytrace_max_range: 30.0
            clearing: true
            marking: true

        zed_points:
            topic: /zed/zed_node/point_cloud/cloud_registered
            data_type: PointCloud2
            # expected_update_rate: 0.0
            # observation_persistence: 0.0
            min_obstacle_height: 0.05
            max_obstacle_height: 0.75
            obstacle_min_range: 0.1
            obstacle_max_range: 10.0
            raytrace_min_range: 0.1
            raytrace_max_range: 12.0
            clearing: true
            marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.55
        inflate_unknown: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 6.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 3.0, 2.0]
    min_velocity: [-3.0, -3.0, -2.0]
    max_accel: [3.5, 3.5, 6.0]
    max_decel: [-3.5, -3.5, -6.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
