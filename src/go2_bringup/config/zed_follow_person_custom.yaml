/**:
  ros__parameters:
    general:
      pub_resolution: 'NATIVE'
      pub_downscale_factor: 1.0

    object_detection:
      od_enabled: true
      enable_tracking: true
      detection_model: 'CUSTOM_YOLOLIKE_BOX_OBJECTS'
      max_range: 10.0
      prediction_timeout: 1.0
      allow_reduced_precision_inference: true

      # Replace this with the exported YOLO-like ONNX file you want the ZED SDK
      # to optimize and run for custom object detection.
      custom_onnx_file: '/absolute/path/to/follow_person.onnx'
      custom_onnx_input_size: 640
      custom_class_count: 1

      class_000:
        label: 'person'
        model_class_id: 0
        enabled: true
        confidence_threshold: 45.0
        is_grounded: true
        is_static: false
        tracking_timeout: 1.0
        tracking_max_dist: -1.0
        max_box_width_normalized: -1.0
        min_box_width_normalized: -1.0
        max_box_height_normalized: -1.0
        min_box_height_normalized: -1.0
        max_box_width_meters: -1.0
        min_box_width_meters: -1.0
        max_box_height_meters: -1.0
        min_box_height_meters: -1.0
        object_acceleration_preset: 'DEFAULT'
        max_allowed_acceleration: 100000.0
